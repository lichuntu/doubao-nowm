#!name=豆包无水印原图
#!desc=打开豆包分享页(www.doubao.com/thread/*)时，把 SSR 数据里带水印(lwm3)的图片链接整段替换为无水印原图(image_raw)。页面显示即为原图，长按保存即得无水印大图。
#!author=lichuntu
#!repo=https://github.com/lichuntu/doubao-nowm
#!icon=https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc_gen_image/02d1b4ba381c43a6994b4d5e4d886152.jpeg~tplv-a9rns2rl98-cthumb_lwm3.png

[rewrite_local]
^https?:\/\/www\.doubao\.com\/thread\/ url script-response-body https://cdn.jsdelivr.net/gh/lichuntu/doubao-nowm@main/doubao-nowm.js

[mitm]
hostname = www.doubao.com

# ===============================================================
# 豆包分享页 · 无水印原图
# ===============================================================
#
# 【使用方法】
#   QuantumultX → 设置 → 引用资源(资源引用) → 添加
#   粘贴本文件的原始链接：
#   https://cdn.jsdelivr.net/gh/lichuntu/doubao-nowm@main/doubao-nowm.conf
#
#   或者：QX 配置文件里加一行
#   resource_parser_url 不需要，直接在「引用资源」里添加上述 URL 即可。
#
#   若使用配置文件方式引用：
#   [resource]
#   doubao-nowm = https://cdn.jsdelivr.net/gh/lichuntu/doubao-nowm@main/doubao-nowm.conf, tag=豆包无水印, enabled=true
#
# 【前置条件】
#   1. 已安装并信任 QX 证书
#      (设置 → 通用 → 关于本机 → 证书信任设置 → 完全信任)
#   2. QX 的「重写」和「MITM」总开关已打开
#
# 【注意】
#   ⚠️ 不要把 byteimg.com 加入 MITM
#      图片 CDN 是二进制流，解密只会拖慢加载甚至报错。
#      本规则只改 HTML 响应，图片链接一改，浏览器自然去请求无水印图。
#
# 【原理】
#   分享页是 React SPA + SSR，HTML 里没有 <img>，
#   图片数据藏在 <script> 内嵌的 SSR JSON 里。同一张图下发多个变体：
#     image_preview   ~tplv-*-cgen_lwm3.png      带水印(页面默认显示)
#     image_thumb     ~tplv-*-cthumb_lwm3.png    带水印缩略图
#     image_ori_raw   ~tplv-*-image_raw.png      无水印原图 ★
#   脚本把 lwm3 链接整段替换为同图 image_raw 链接。
#
#   ⚠️ 不能只替换模板名：同图的 image_raw 与 lwm3 host 不同(如 p26- vs p3-)，
#      且 x-signature 按 host+路径+模板签名，改名即失配 → 403。
#      必须取 image_ori_raw 字段自带的完整 URL。
#
# 【故障排查】
#   图片仍带水印 → ① 证书是否「完全信任」 ② MITM 是否开启
#                   ③ 清 Safari 缓存 ④ 分享页 URL 结构是否变了
#   页面白屏/图裂 → 脚本匹配越界改坏 JSON，请到仓库提 Issue 并附响应体
#
# ===============================================================
