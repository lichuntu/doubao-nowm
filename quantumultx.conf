/*
 * QuantumultX 配置片段 —— 豆包分享页无水印原图
 * ===============================================================
 * 把下面 [rewrite_local] 与 [mitm] 两段，合并进你的 QX 配置文件
 * （通常通过「配置文件 → 编辑」或 App 内的配置订阅文件）
 * ===============================================================
 */

[rewrite_local]

# ── 豆包分享页：SSR 数据中的图片链接改为无水印原图 ──
# 匹配所有分享页；只有含 byteimg 图片数据的响应才会被实际修改，
# 其他响应脚本内部会直接放行（不影响打开速度）。
^https?:\/\/www\.doubao\.com\/thread\/ url script-response-body https://raw.githubusercontent.com/lichuntu/doubao-nowm/main/doubao-nowm.js

# 如果你的 QX 版本要求正则严格锚定，也可用下面这条（不带结尾斜杠的短链同样命中）
# ^https?:\/\/www\.doubao\.com\/thread\/ url script-response-body https://raw.githubusercontent.com/lichuntu/doubao-nowm/main/doubao-nowm.js


[mitm]

# ── 必须把豆包分享页域名加入 MITM 解密列表 ──
# ⚠️ 注意：不要加 byteimg.com！
#    图片 CDN 走的是二进制流，解密它只会拖慢加载且可能报错。
#    我们改的是 HTML 响应，图片链接一改，浏览器自然去请求无水印图。
hostname = www.doubao.com


/*
 * ===============================================================
 * 使用步骤
 * ===============================================================
 *
 * 1. 确保 QX 已生成并安装证书（设置 → 证书管理 → 生成证书 → 安装）
 *    然后在 iOS「设置 → 通用 → VPN与设备管理」安装描述文件，
 *    再到「设置 → 通用 → 关于本机 → 证书信任设置」开启【完全信任】。
 *    （这一步最常漏，漏了 HTTPS 就抓不到也改不了）
 *
 * 2. 在 QX 配置里加入上面的 [rewrite_local] 和 [mitm] 内容。
 *
 * 3. 打开 QX 的「重写」与「MITM」总开关，并启动 QX。
 *
 * 4. 用浏览器打开任意豆包分享链接，例如：
 *       https://www.doubao.com/thread/a0a8a0503a12b
 *    页面里的图片应当直接是【无水印原图】，长按即可保存。
 *
 * ===============================================================
 * 验证是否生效
 * ===============================================================
 *
 * 简易判断：打开分享页 → 长按图片保存 → 查看角落是否有豆包水印。
 *
 * 进阶判断（QX 日志）：
 *   在 QX 的「日志」里搜索 doubao-nowm，应当能看到请求被脚本处理。
 *   如需详细输出，可在脚本里打开 console.log 行。
 *
 * ===============================================================
 * 常见问题
 * ===============================================================
 *
 * Q: 图片还是带水印？
 * A: ① 检查 MITM 是否开启、证书是否「完全信任」；
 *    ② 检查 hostname 是否包含 www.doubao.com；
 *    ③ 清除 Safari 缓存后重开（页面可能被缓存了旧版）；
 *    ④ 若豆包分享页的 URL 结构变了（如变成 /share/xxx），需同步修改正则。
 *
 * Q: 页面白屏 / 图片全裂？
 * A: 大概率是脚本匹配越界改坏了 JSON。请到 Issues 反馈，并附上
 *    一次抓包的响应体（可用 QX 抓包导出或浏览器开发者工具另存）。
 *
 * Q: 会不会影响 App 内使用？
 * A: 本规则只匹配 www.doubao.com/thread/* 的网页分享页，
 *    不影响豆包 App 自身的接口请求。
 *
 * ===============================================================
 * 免责声明
 * ===============================================================
 * 本项目仅供个人学习与自用（保存自己生成的图片）。
 * AI 生成内容依《人工智能生成合成内容标识办法》应保有标识，
 * 请勿用于去除他人作品标识、二次分发或商业用途。
 */
